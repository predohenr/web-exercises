<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Exercício 1</title>
</head>
<body>
    <div class="conteudo-central">
        <div class="titulo-site">
            <h1>Atividade 1 - Inserir Objetos em Arrays</h1>
        </div>
        <form class="formulario" onsubmit="salvarUsuario(event)">
            <div class="campos-formulario">
                <h2 class="form-title">Usuário</h1>
                <input type="username" id="usuario-campo" required>
            </div>
            <div class="campos-formulario">
                <h2 class="form-title">Email</h1>
                <input type="email" id="email-campo" required>
            </div>
            <button type="submit">Enviar</button>
        </form>
        <div id="lista"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
